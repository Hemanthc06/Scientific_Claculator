<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Animated background blobs -->
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="app">
  <!-- History Panel -->
  <aside class="history" id="historyPanel">
    <div class="history-header">
      <h2>History</h2>
      <button class="history-clear" id="historyClear">Clear</button>
    </div>
    <div class="history-list" id="historyList">
      <p class="history-empty">No calculations yet</p>
    </div>
  </aside>

  <!-- Calculator -->
  <main class="calculator">
    <header class="calc-header">
      <div class="brand">
        <div class="brand-dot"></div>
        <span>Scientific</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" title="Toggle theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="icon-btn" id="historyToggle" title="Toggle history">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M12 7v5l3 2"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="display">
      <div class="display-top">
        <span class="mode-badge" id="modeBadge">DEG</span>
        <span class="expression" id="expression"></span>
      </div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons" id="buttons">
      <button class="btn-toggle" data-action="toggle" id="modeToggle">DEG</button>
      <button class="btn-func" data-fn="sin">sin</button>
      <button class="btn-func" data-fn="cos">cos</button>
      <button class="btn-func" data-fn="tan">tan</button>
      <button class="btn-clear" data-action="clear">AC</button>

      <button class="btn-func" data-fn="ln">ln</button>
      <button class="btn-func" data-fn="log">log</button>
      <button class="btn-func" data-fn="sqrt">√</button>
      <button class="btn-func" data-fn="pow">xʸ</button>
      <button class="btn-op" data-action="delete">⌫</button>

      <button class="btn-func" data-action="open">(</button>
      <button class="btn-func" data-action="close">)</button>
      <button class="btn-func" data-const="PI">π</button>
      <button class="btn-func" data-const="E">e</button>
      <button class="btn-func" data-fn="fact">n!</button>

      <button class="btn-num" data-num="7">7</button>
      <button class="btn-num" data-num="8">8</button>
      <button class="btn-num" data-num="9">9</button>
      <button class="btn-op" data-op="/">÷</button>
      <button class="btn-func" data-fn="inv">1/x</button>

      <button class="btn-num" data-num="4">4</button>
      <button class="btn-num" data-num="5">5</button>
      <button class="btn-num" data-num="6">6</button>
      <button class="btn-op" data-op="*">×</button>
      <button class="btn-func" data-fn="exp">eˣ</button>

      <button class="btn-num" data-num="1">1</button>
      <button class="btn-num" data-num="2">2</button>
      <button class="btn-num" data-num="3">3</button>
      <button class="btn-op" data-op="-">−</button>
      <button class="btn-func" data-fn="10pow">10ˣ</button>

      <button class="btn-num" data-num="0">0</button>
      <button class="btn-num" data-action="dot">.</button>
      <button class="btn-func" data-action="negate">±</button>
      <button class="btn-op" data-op="+">+</button>
      <button class="btn-equals" data-action="equals">=</button>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
